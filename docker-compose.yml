services:
  postgres:
    image: postgres:16-alpine
    container_name: nerdhub_postgres
    environment:
      POSTGRES_DB: nerdhub
      POSTGRES_USER: nerdhub
      POSTGRES_PASSWORD: nerdhub
    ports:
      - '5432:5432'
    volumes:
      - nerdhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nerdhub -d nerdhub']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nerdhub_redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  nerdhub_postgres_data:
