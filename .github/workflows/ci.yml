name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable corepack (and thus the pnpm shim) before setup-node configures
      # pnpm caching, so pnpm is available for the cache lookup/restore.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client types are required by TypeScript typecheck (the API
      # imports @prisma/client). Generate from the schema in this job rather
      # than relying on artifacts produced by another job.
      - name: Generate Prisma client
        run: pnpm --filter @nerdhub/api prisma generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nerdhub
          POSTGRES_PASSWORD: nerdhub
          POSTGRES_DB: nerdhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nerdhub -d nerdhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nerdhub/api prisma generate
        env:
          DATABASE_URL: postgresql://nerdhub:nerdhub@localhost:5432/nerdhub

      - name: Deploy Prisma migrations
        run: pnpm --filter @nerdhub/api prisma migrate deploy
        env:
          DATABASE_URL: postgresql://nerdhub:nerdhub@localhost:5432/nerdhub

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://nerdhub:nerdhub@localhost:5432/nerdhub
          REDIS_URL: redis://localhost:6379

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API build compiles TypeScript that references @prisma/client types,
      # so Prisma Client must be generated in this job before building.
      - name: Generate Prisma client
        run: pnpm --filter @nerdhub/api prisma generate

      - name: Build all workspace projects
        run: pnpm build
